{% extends 'base.html' %}

{% block title %}All Leagues{% endblock %}

{% block content %}
  This is the leagues home page
  {% for ff_league in ff_leagues %}
    <div class="card" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">{{ ff_league.name }}</h5>
            <a href="{% url 'league' league_id=ff_league.id %}">go to league</a>
        </div>
    </div>
  {% endfor %}
{% endblock %}
